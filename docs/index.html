<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>diffnoun</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="wrap brand">
      <img src="logo.svg" alt="diffnoun mark">
      <div>
        <h1>diffnoun</h1>
        <p class="tag">Nouns from unified diffs</p>
      </div>
    </div>
  </header>
  <main class="wrap">
    <section class="card">
      <h2>Purpose</h2>
      <p>Read a unified diff from stdin or a file and print add, remove, and change lines from +++ / --- / @@ headers.</p>
      <h2>Install</h2>
      <pre><code>npm install -g diffnoun</code></pre>
      <h2>Usage</h2>
      <pre><code>diffnoun patch.diff</code></pre>
    </section>
    <footer>MIT © 2026 theworker02 · navy #0B1F33 · gold #C9A227</footer>
  </main>
</body>
</html>
